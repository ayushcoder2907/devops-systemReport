name: PR-Gatekeeper

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Print Target Branch
        run: |
            echo "PR is being merged into: ${{ github.base_ref }}"

      - name: Print PR Number
        run: |
            echo "PR Number: ${{ github.event.pull_request.number }}"

      - name: Complete PR-Gatekeeper Checks
        run: echo "Gatekeeper checks complete"